<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1000" height="300" fill="#ffffff"/>
  <defs>
    <marker id="cosArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Top (module) containment -->
  <rect x="20" y="20" width="960" height="260" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="50" font-size="16" font-weight="bold">Top (module)</text>

  <!-- Core (module) containment -->
  <rect x="60" y="70" width="880" height="180" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="100" font-size="16" font-weight="bold">Core (module)</text>

  <!-- sparcThread procedure -->
  <rect x="140" y="130" width="320" height="90" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="300" y="168" text-anchor="middle" font-size="16" font-weight="bold">sparcThread</text>
  <text x="300" y="192" text-anchor="middle" font-size="13">SparcThread (procedure)</text>

  <!-- mainMemory procedure -->
  <rect x="560" y="130" width="320" height="90" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="720" y="168" text-anchor="middle" font-size="16" font-weight="bold">mainMemory</text>
  <text x="720" y="192" text-anchor="middle" font-size="13">VirtualMainMemory (procedure)</text>

  <!-- handshake -->
  <line x1="460" y1="175" x2="560" y2="175" stroke="#000000" stroke-width="2.5"
        marker-start="url(#cosArrow)" marker-end="url(#cosArrow)"/>
  <text x="510" y="155" text-anchor="middle" font-size="16">||</text>
</svg>
