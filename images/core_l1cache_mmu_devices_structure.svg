<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="clmdArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Top (module) containment -->
  <rect x="20" y="20" width="1160" height="480" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="50" font-size="16" font-weight="bold">Top (module)</text>

  <!-- System (module) containment -->
  <rect x="40" y="60" width="1130" height="420" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="90" font-size="16" font-weight="bold">System (module)</text>

  <!-- Core (module) containment -->
  <rect x="60" y="130" width="590" height="210" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="80" y="160" font-size="16" font-weight="bold">Core (module)</text>

  <!-- sparcThread procedure -->
  <rect x="80" y="200" width="160" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="160" y="240" text-anchor="middle" font-size="16" font-weight="bold">sparcThread</text>
  <text x="160" y="264" text-anchor="middle" font-size="12">SparcThread (procedure)</text>

  <!-- caches procedure -->
  <rect x="280" y="200" width="160" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="360" y="234" text-anchor="middle" font-size="16" font-weight="bold">caches</text>
  <text x="360" y="256" text-anchor="middle" font-size="12">L1Caches (procedure)</text>
  <text x="360" y="276" text-anchor="middle" font-size="12">I-cache, D-cache</text>

  <!-- mmu procedure -->
  <rect x="480" y="200" width="150" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="555" y="240" text-anchor="middle" font-size="16" font-weight="bold">mmu</text>
  <text x="555" y="264" text-anchor="middle" font-size="12">Mmu (procedure)</text>

  <!-- handshakes -->
  <line x1="240" y1="250" x2="280" y2="250" stroke="#000000" stroke-width="2.5"
        marker-start="url(#clmdArrow)" marker-end="url(#clmdArrow)"/>
  <text x="260" y="232" text-anchor="middle" font-size="16">||</text>
  <line x1="440" y1="250" x2="480" y2="250" stroke="#000000" stroke-width="2.5"
        marker-start="url(#clmdArrow)" marker-end="url(#clmdArrow)"/>
  <text x="460" y="232" text-anchor="middle" font-size="16">||</text>

  <!-- bridge module -->
  <rect x="730" y="120" width="160" height="300" fill="#e2f0d9" stroke="#000000" stroke-width="1.5"/>
  <text x="810" y="262" text-anchor="middle" font-size="16" font-weight="bold">bridge</text>
  <text x="810" y="286" text-anchor="middle" font-size="12">SystemBridge (module)</text>

  <!-- mainMemory module -->
  <rect x="950" y="120" width="200" height="100" fill="#fce8ec" stroke="#000000" stroke-width="1.5"/>
  <text x="1050" y="162" text-anchor="middle" font-size="16" font-weight="bold">mainMemory</text>
  <text x="1050" y="186" text-anchor="middle" font-size="12">PhysicalMainMemory (module)</text>

  <!-- devices module -->
  <rect x="950" y="320" width="200" height="100" fill="#fff2cc" stroke="#000000" stroke-width="1.5"/>
  <text x="1050" y="356" text-anchor="middle" font-size="16" font-weight="bold">devices</text>
  <text x="1050" y="378" text-anchor="middle" font-size="12">PeripheralDevices (module)</text>
  <text x="1050" y="400" text-anchor="middle" font-size="11">Timer, Serial, Interrupt Controller</text>

  <!-- core <-> bridge nets -->
  <line x1="630" y1="230" x2="728" y2="230" stroke="#000000" stroke-width="2.5" marker-end="url(#clmdArrow)"/>
  <text x="680" y="215" text-anchor="middle" font-size="12">request</text>
  <line x1="728" y1="272" x2="630" y2="272" stroke="#000000" stroke-width="2.5" marker-end="url(#clmdArrow)"/>
  <text x="680" y="295" text-anchor="middle" font-size="12">response</text>

  <!-- bridge <-> mainMemory nets -->
  <line x1="890" y1="150" x2="948" y2="150" stroke="#000000" stroke-width="2.5" marker-end="url(#clmdArrow)"/>
  <line x1="948" y1="190" x2="890" y2="190" stroke="#000000" stroke-width="2.5" marker-end="url(#clmdArrow)"/>

  <!-- bridge <-> devices nets -->
  <line x1="890" y1="350" x2="948" y2="350" stroke="#000000" stroke-width="2.5" marker-end="url(#clmdArrow)"/>
  <line x1="948" y1="390" x2="890" y2="390" stroke="#000000" stroke-width="2.5" marker-end="url(#clmdArrow)"/>

  <!-- interrupt level net: devices -> core (a single signal: thinner) -->
  <polyline points="1050,420 1050,455 160,455 160,342" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#clmdArrow)"/>
  <text x="600" y="447" text-anchor="middle" font-size="13">interruptLevelNet (IRL)</text>
</svg>
