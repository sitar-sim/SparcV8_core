<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <defs>
    <marker id="fsmArrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <ellipse cx="130" cy="120" rx="95" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="130" y="126" text-anchor="middle" font-size="14" font-weight="bold">RX_DISABLED</text>

  <ellipse cx="520" cy="120" rx="95" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="126" text-anchor="middle" font-size="14" font-weight="bold">RX_ENABLED</text>

  <ellipse cx="520" cy="330" rx="110" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="336" text-anchor="middle" font-size="13" font-weight="bold">RX_DATA_RECEIVED</text>

  <line x1="20" y1="70" x2="90" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow4)"/>
  <text x="15" y="60" font-size="13">RESET</text>

  <path d="M 225,115 C 320,105 380,105 425,113" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow4)"/>
  <text x="325" y="90" text-anchor="middle" font-size="12">Rx_en==1 / Rx_full=0</text>

  <path d="M 425,140 C 380,155 320,155 225,142" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow4)"/>
  <text x="325" y="172" text-anchor="middle" font-size="12">Rx_en==0 / INT=0</text>

  <!-- RX_ENABLED -> RX_DATA_RECEIVED: down the right side -->
  <path d="M 555,160 C 590,205 590,250 560,290" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow4)"/>
  <text x="600" y="195" text-anchor="middle" font-size="12">data received on Rx pin /</text>
  <text x="600" y="210" text-anchor="middle" font-size="12">Rx_full=1, INT=Rx_int_en</text>

  <!-- RX_DATA_RECEIVED -> RX_ENABLED: up the right side, bowed further out -->
  <path d="M 585,295 C 655,250 655,190 565,155" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow4)"/>
  <text x="595" y="250" text-anchor="middle" font-size="12">Rx register read by cpu /</text>
  <text x="595" y="265" text-anchor="middle" font-size="12">Rx_full=0, INT=0</text>

  <!-- RX_DATA_RECEIVED -> RX_DISABLED -->
  <path d="M 430,310 C 300,270 200,220 155,163" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow4)"/>
  <text x="230" y="260" text-anchor="middle" font-size="12">Rx_en==0 /</text>
  <text x="230" y="275" text-anchor="middle" font-size="12">Rx_full=0, INT=0</text>

  <text x="350" y="405" text-anchor="middle" font-size="13" fill="#555555">Receive side. Control register bit[1]=Rx_en, bit[2]=Rx_interrupt_enable,</text>
  <text x="350" y="422" text-anchor="middle" font-size="13" fill="#555555">bit[4]=Rx_full (read-only).</text>
</svg>
