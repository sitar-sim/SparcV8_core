<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="480" fill="#ffffff"/>
  <defs>
    <marker id="apArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
    <marker id="apArrowSmall" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Top (module) containment -->
  <rect x="20" y="20" width="1160" height="440" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="50" font-size="16" font-weight="bold">Top (module)</text>

  <!-- engine (module) containment -->
  <rect x="40" y="60" width="1120" height="380" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="90" font-size="16" font-weight="bold">engine : AparaEngine (module)</text>

  <!-- fetch -->
  <rect x="70" y="130" width="160" height="100" fill="#e8e0f5" stroke="#000000" stroke-width="1.5"/>
  <text x="150" y="170" text-anchor="middle" font-size="16" font-weight="bold">fetch</text>
  <text x="150" y="193" text-anchor="middle" font-size="12">AparaFetch (module)</text>
  <text x="150" y="213" text-anchor="middle" font-size="11">thread PCs, BTB</text>

  <!-- decode -->
  <rect x="330" y="130" width="160" height="100" fill="#e8e0f5" stroke="#000000" stroke-width="1.5"/>
  <text x="410" y="170" text-anchor="middle" font-size="16" font-weight="bold">decode</text>
  <text x="410" y="193" text-anchor="middle" font-size="12">AparaDecode (module)</text>

  <!-- regfile -->
  <rect x="600" y="130" width="170" height="100" fill="#e8e0f5" stroke="#000000" stroke-width="1.5"/>
  <text x="685" y="170" text-anchor="middle" font-size="16" font-weight="bold">regfile</text>
  <text x="685" y="193" text-anchor="middle" font-size="12">AparaRegfile (module)</text>
  <text x="685" y="213" text-anchor="middle" font-size="11">register locks, tokens</text>

  <!-- exec -->
  <rect x="900" y="130" width="200" height="100" fill="#e8e0f5" stroke="#000000" stroke-width="1.5"/>
  <text x="1000" y="170" text-anchor="middle" font-size="16" font-weight="bold">exec</text>
  <text x="1000" y="193" text-anchor="middle" font-size="12">AparaExec (module)</text>
  <text x="1000" y="211" text-anchor="middle" font-size="11">the engine's state:</text>
  <text x="1000" y="224" text-anchor="middle" font-size="11">IMEM, DMEM, registers</text>

  <!-- writeback -->
  <rect x="600" y="320" width="170" height="90" fill="#e8e0f5" stroke="#000000" stroke-width="1.5"/>
  <text x="685" y="355" text-anchor="middle" font-size="16" font-weight="bold">writeback</text>
  <text x="685" y="378" text-anchor="middle" font-size="12">AparaWriteback (module)</text>

  <!-- fetch -> decode -->
  <line x1="230" y1="180" x2="328" y2="180" stroke="#000000" stroke-width="2.5" marker-end="url(#apArrow)"/>
  <text x="280" y="168" text-anchor="middle" font-size="12">fetchToDecode</text>

  <!-- decode -> regfile: one net per thread -->
  <line x1="490" y1="150" x2="598" y2="150" stroke="#000000" stroke-width="1.5" marker-end="url(#apArrowSmall)"/>
  <line x1="490" y1="170" x2="598" y2="170" stroke="#000000" stroke-width="1.5" marker-end="url(#apArrowSmall)"/>
  <line x1="490" y1="190" x2="598" y2="190" stroke="#000000" stroke-width="1.5" marker-end="url(#apArrowSmall)"/>
  <line x1="490" y1="210" x2="598" y2="210" stroke="#000000" stroke-width="1.5" marker-end="url(#apArrowSmall)"/>
  <text x="545" y="250" text-anchor="middle" font-size="12">decodeToRegfile[0..3]</text>
  <text x="545" y="265" text-anchor="middle" font-size="11">one net per thread</text>

  <!-- regfile <-> exec -->
  <line x1="770" y1="160" x2="898" y2="160" stroke="#000000" stroke-width="2.5" marker-end="url(#apArrow)"/>
  <text x="835" y="150" text-anchor="middle" font-size="12">regfileToExec</text>
  <line x1="898" y1="205" x2="770" y2="205" stroke="#000000" stroke-width="2.5" marker-end="url(#apArrow)"/>
  <text x="835" y="225" text-anchor="middle" font-size="12">execToRegfile</text>

  <!-- regfile -> writeback -->
  <line x1="685" y1="230" x2="685" y2="318" stroke="#000000" stroke-width="2.5" marker-end="url(#apArrow)"/>
  <text x="697" y="280" font-size="12">regfileToWriteback</text>

  <!-- writeback -> fetch -->
  <polyline points="600,365 150,365 150,232" fill="none" stroke="#000000" stroke-width="2.5" marker-end="url(#apArrow)"/>
  <text x="375" y="355" text-anchor="middle" font-size="12">correctionNet, haltNet</text>

  <!-- exec -> fetch: thread start and reset -->
  <polyline points="1000,130 1000,110 190,110 190,128" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#apArrowSmall)"/>
  <text x="600" y="104" text-anchor="middle" font-size="12">fetchControlNet (thread start and reset)</text>
</svg>
