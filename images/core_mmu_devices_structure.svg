<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="520" fill="#ffffff"/>
  <defs>
    <marker id="cmdsArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Top (module) containment -->
  <rect x="20" y="20" width="1160" height="480" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="50" font-size="16" font-weight="bold">Top (module)</text>

  <!-- System (module) containment -->
  <rect x="50" y="60" width="1110" height="420" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="90" font-size="16" font-weight="bold">System (module)</text>

  <!-- Core (module) containment -->
  <rect x="80" y="130" width="480" height="210" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="100" y="160" font-size="16" font-weight="bold">Core (module)</text>

  <!-- sparcThread procedure -->
  <rect x="110" y="200" width="180" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="200" y="240" text-anchor="middle" font-size="16" font-weight="bold">sparcThread</text>
  <text x="200" y="264" text-anchor="middle" font-size="13">SparcThread (procedure)</text>

  <!-- mmu procedure -->
  <rect x="370" y="200" width="160" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="450" y="240" text-anchor="middle" font-size="16" font-weight="bold">mmu</text>
  <text x="450" y="264" text-anchor="middle" font-size="13">Mmu (procedure)</text>

  <!-- handshake -->
  <line x1="290" y1="250" x2="370" y2="250" stroke="#000000" stroke-width="2.5"
        marker-start="url(#cmdsArrow)" marker-end="url(#cmdsArrow)"/>
  <text x="330" y="230" text-anchor="middle" font-size="16">||</text>

  <!-- bridge module -->
  <rect x="660" y="120" width="180" height="300" fill="#e2f0d9" stroke="#000000" stroke-width="1.5"/>
  <text x="750" y="262" text-anchor="middle" font-size="16" font-weight="bold">bridge</text>
  <text x="750" y="286" text-anchor="middle" font-size="13">SystemBridge (module)</text>

  <!-- mainMemory module -->
  <rect x="920" y="120" width="220" height="100" fill="#fce8ec" stroke="#000000" stroke-width="1.5"/>
  <text x="1030" y="162" text-anchor="middle" font-size="16" font-weight="bold">mainMemory</text>
  <text x="1030" y="186" text-anchor="middle" font-size="13">PhysicalMainMemory (module)</text>

  <!-- devices module -->
  <rect x="920" y="320" width="220" height="100" fill="#fff2cc" stroke="#000000" stroke-width="1.5"/>
  <text x="1030" y="356" text-anchor="middle" font-size="16" font-weight="bold">devices</text>
  <text x="1030" y="378" text-anchor="middle" font-size="13">PeripheralDevices (module)</text>
  <text x="1030" y="400" text-anchor="middle" font-size="12">Timer, Serial, Interrupt Controller</text>

  <!-- core <-> bridge nets -->
  <line x1="530" y1="230" x2="658" y2="230" stroke="#000000" stroke-width="2.5" marker-end="url(#cmdsArrow)"/>
  <text x="600" y="215" text-anchor="middle" font-size="13">coreRequestNet</text>
  <line x1="658" y1="272" x2="530" y2="272" stroke="#000000" stroke-width="2.5" marker-end="url(#cmdsArrow)"/>
  <text x="600" y="295" text-anchor="middle" font-size="13">coreResponseNet</text>

  <!-- bridge <-> mainMemory nets -->
  <line x1="840" y1="150" x2="918" y2="150" stroke="#000000" stroke-width="2.5" marker-end="url(#cmdsArrow)"/>
  <line x1="918" y1="190" x2="840" y2="190" stroke="#000000" stroke-width="2.5" marker-end="url(#cmdsArrow)"/>
  <text x="880" y="140" text-anchor="middle" font-size="12">request</text>
  <text x="880" y="208" text-anchor="middle" font-size="12">response</text>

  <!-- bridge <-> devices nets -->
  <line x1="840" y1="350" x2="918" y2="350" stroke="#000000" stroke-width="2.5" marker-end="url(#cmdsArrow)"/>
  <line x1="918" y1="390" x2="840" y2="390" stroke="#000000" stroke-width="2.5" marker-end="url(#cmdsArrow)"/>
  <text x="880" y="340" text-anchor="middle" font-size="12">request</text>
  <text x="880" y="408" text-anchor="middle" font-size="12">response</text>

  <!-- interrupt level net: devices -> core (a single signal: thinner) -->
  <polyline points="1030,420 1030,455 200,455 200,342" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#cmdsArrow)"/>
  <text x="615" y="447" text-anchor="middle" font-size="13">interruptLevelNet (IRL)</text>
</svg>
