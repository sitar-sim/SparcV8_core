<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <defs>
    <marker id="fsmArrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <ellipse cx="130" cy="120" rx="95" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="130" y="126" text-anchor="middle" font-size="15" font-weight="bold">IRC_DISABLED</text>

  <ellipse cx="520" cy="120" rx="95" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="126" text-anchor="middle" font-size="15" font-weight="bold">IRC_ENABLED</text>

  <ellipse cx="520" cy="330" rx="105" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="336" text-anchor="middle" font-size="14" font-weight="bold">IRC_INTERRUPTING</text>

  <line x1="20" y1="70" x2="90" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow2)"/>
  <text x="15" y="60" font-size="13">RESET</text>

  <path d="M 225,115 C 320,105 380,105 425,113" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow2)"/>
  <text x="325" y="90" text-anchor="middle" font-size="12">write control_reg[0]=1</text>

  <path d="M 425,140 C 380,155 320,155 225,142" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow2)"/>
  <text x="325" y="172" text-anchor="middle" font-size="12">write control_reg[0]=0 / int_out=0</text>

  <path d="M 528,165 C 528,220 528,245 525,283" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow2)"/>
  <text x="590" y="215" text-anchor="middle" font-size="12">unmasked source active /</text>
  <text x="590" y="230" text-anchor="middle" font-size="12">int_out = highest-priority</text>
  <text x="590" y="245" text-anchor="middle" font-size="12">unmasked source's IRL</text>

  <path d="M 430,310 C 300,270 200,220 155,163" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow2)"/>
  <text x="230" y="270" text-anchor="middle" font-size="12">write control_reg[0]=0 / int_out=0</text>

  <text x="350" y="405" text-anchor="middle" font-size="13" fill="#555555">One per-core instance. See the Interrupt Controller page for the control</text>
  <text x="350" y="422" text-anchor="middle" font-size="13" fill="#555555">register's per-source mask bits and priority-encoding details.</text>
</svg>
