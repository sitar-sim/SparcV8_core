name: Build and deploy docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs

    steps:
      # 1. Get your repository code
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. Set up Python on the CI machine
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # 3. Install documentation dependencies (also pulls in the vendored
      #    Pygments lexer via the -e ./sitar_pygments_lexer line in
      #    requirements.txt -- relative to this docs/ working directory)
      - name: Install docs dependencies
        run: pip install -r requirements.txt

      # 4. Build the static site
      - name: Build documentation
        run: mkdocs build

      # 5. Publish to gh-pages
      - name: Deploy documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/sitar-sim/SparcV8_core.git

          mkdocs gh-deploy --clean --force
