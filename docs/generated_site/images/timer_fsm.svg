<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="440" fill="#ffffff"/>
  <defs>
    <marker id="fsmArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
    </marker>
  </defs>

  <!-- States -->
  <ellipse cx="130" cy="120" rx="95" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="130" y="126" text-anchor="middle" font-size="15" font-weight="bold">TIMER_DISABLED</text>

  <ellipse cx="520" cy="120" rx="95" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="126" text-anchor="middle" font-size="15" font-weight="bold">TIMER_ENABLED</text>

  <ellipse cx="520" cy="330" rx="105" ry="45" fill="#fdf1d6" stroke="#000000" stroke-width="1.5"/>
  <text x="520" y="336" text-anchor="middle" font-size="14" font-weight="bold">TIMER_INTERRUPTING</text>

  <!-- RESET -> DISABLED -->
  <line x1="20" y1="70" x2="90" y2="100" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="15" y="60" font-size="13">RESET</text>

  <!-- DISABLED -> ENABLED -->
  <path d="M 225,115 C 320,105 380,105 425,113" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="325" y="90" text-anchor="middle" font-size="12">Timer_en==1 /</text>
  <text x="325" y="105" text-anchor="middle" font-size="12">count=max_count, INT=0</text>

  <!-- ENABLED -> DISABLED -->
  <path d="M 425,140 C 380,155 320,155 225,142" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="325" y="172" text-anchor="middle" font-size="12">Timer_en==0 / count=0, INT=0</text>

  <!-- ENABLED self-loop (tick, count>0) -->
  <path d="M 480,80 C 470,30 570,30 560,80" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="520" y="35" text-anchor="middle" font-size="12">tick, count&gt;0 / count=count-1</text>

  <!-- ENABLED -> INTERRUPTING -->
  <path d="M 528,165 C 528,220 528,245 525,283" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="595" y="215" text-anchor="middle" font-size="12">tick, count==0 /</text>
  <text x="595" y="230" text-anchor="middle" font-size="12">INT=1</text>

  <!-- INTERRUPTING -> DISABLED -->
  <path d="M 430,310 C 300,270 200,220 155,163" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#fsmArrow)"/>
  <text x="230" y="270" text-anchor="middle" font-size="12">Timer_en==0 / count=0, INT=0</text>

  <text x="350" y="420" text-anchor="middle" font-size="13" fill="#555555">One-shot mode. Control register: bit[0]=Timer_en, bits[31:1]=max_count.</text>
</svg>
