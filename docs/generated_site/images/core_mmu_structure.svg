<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1200" height="420" fill="#ffffff"/>
  <defs>
    <marker id="cmsArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="18" markerHeight="18" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
  </defs>

  <!-- Top (module) containment -->
  <rect x="20" y="20" width="1160" height="380" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="40" y="50" font-size="16" font-weight="bold">Top (module)</text>

  <!-- System (module) containment -->
  <rect x="50" y="60" width="1100" height="320" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="70" y="90" font-size="16" font-weight="bold">System (module)</text>

  <!-- Core (module) containment -->
  <rect x="80" y="100" width="620" height="220" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="100" y="130" font-size="16" font-weight="bold">Core (module)</text>

  <!-- sparcThread procedure -->
  <rect x="120" y="200" width="260" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="250" y="240" text-anchor="middle" font-size="16" font-weight="bold">sparcThread</text>
  <text x="250" y="264" text-anchor="middle" font-size="13">SparcThread (procedure)</text>

  <!-- mmu procedure -->
  <rect x="460" y="200" width="220" height="100" fill="#dbe9f7" stroke="#000000" stroke-width="1.5"/>
  <text x="570" y="240" text-anchor="middle" font-size="16" font-weight="bold">mmu</text>
  <text x="570" y="264" text-anchor="middle" font-size="13">Mmu (procedure)</text>

  <!-- handshake -->
  <line x1="380" y1="250" x2="460" y2="250" stroke="#000000" stroke-width="2.5"
        marker-start="url(#cmsArrow)" marker-end="url(#cmsArrow)"/>
  <text x="420" y="230" text-anchor="middle" font-size="16">||</text>

  <!-- mainMemory module (sibling of Core, inside System) -->
  <rect x="800" y="200" width="260" height="100" fill="#fce8ec" stroke="#000000" stroke-width="1.5"/>
  <text x="930" y="240" text-anchor="middle" font-size="16" font-weight="bold">mainMemory</text>
  <text x="930" y="264" text-anchor="middle" font-size="13">PhysicalMainMemory (module)</text>

  <!-- nets: mmu -> mainMemory (requestNet), mainMemory -> mmu (responseNet) -->
  <line x1="680" y1="230" x2="798" y2="230" stroke="#000000" stroke-width="2.5" marker-end="url(#cmsArrow)"/>
  <text x="740" y="215" text-anchor="middle" font-size="13">requestNet</text>

  <line x1="798" y1="272" x2="680" y2="272" stroke="#000000" stroke-width="2.5" marker-end="url(#cmsArrow)"/>
  <text x="740" y="295" text-anchor="middle" font-size="13">responseNet</text>
</svg>
