<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 560" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="1110" height="560" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#000000"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8a8a8a"/>
    </marker>
    <style>
      .box   { stroke: #000000; stroke-width: 1.5; }
      .cpu   { fill: #dbe9f7; }
      .dev   { fill: #fdf1d6; }
      .title { font-size: 18px; font-weight: bold; text-anchor: middle; }
      .sig   { font-size: 16px; text-anchor: middle; }
      .pin   { font-size: 14px; text-anchor: middle; fill: #333333; }
      .note  { font-size: 13px; text-anchor: middle; fill: #666666; }
      .bus   { stroke: #8a8a8a; stroke-width: 5; }
      .tap   { stroke: #8a8a8a; stroke-width: 5; marker-start: url(#arrowGrey); marker-end: url(#arrowGrey); }
      .wire  { stroke: #000000; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .dash  { stroke-dasharray: 5,4; }
    </style>
  </defs>

  <!-- ===== Top row: Core and memory ===== -->
  <rect class="box cpu" x="400" y="30" width="300" height="80"/>
  <text class="title" x="550" y="66">SPARC V8</text>
  <text class="title" x="550" y="88">Core</text>

  <rect class="box cpu" x="820" y="30" width="180" height="80"/>
  <text class="title" x="910" y="76">Main Memory</text>

  <!-- ===== Shared address / data bus ===== -->
  <line class="bus" x1="40" y1="190" x2="1080" y2="190"/>
  <text x="60" y="170" font-size="16" fill="#333333">Shared address / data bus</text>
  <text x="60" y="170" dx="196" font-size="14" fill="#666666">(register read / write)</text>

  <line class="tap" x1="470" y1="110" x2="470" y2="190"/>
  <line class="tap" x1="910" y1="110" x2="910" y2="190"/>
  <line class="tap" x1="135" y1="190" x2="135" y2="270"/>
  <line class="tap" x1="360" y1="190" x2="360" y2="270"/>
  <line class="tap" x1="970" y1="190" x2="970" y2="270"/>

  <!-- ===== Peripherals (all pins on the lower edge) ===== -->
  <rect class="box dev" x="60" y="270" width="150" height="80"/>
  <text class="title" x="135" y="310">Timer</text>

  <rect class="box dev" x="300" y="270" width="460" height="80"/>
  <text class="title" x="530" y="310">Interrupt Controller (IRC)</text>

  <rect class="box dev" x="860" y="270" width="220" height="80"/>
  <text class="title" x="970" y="304">Serial</text>
  <text class="pin" x="950" y="340">Rx</text>
  <text class="pin" x="1045" y="340">Tx</text>

  <!-- ===== Timer pins ===== -->
  <line class="wire" x1="95" y1="430" x2="95" y2="350"/>
  <text class="sig" x="95" y="452">clock_in</text>

  <!-- timer_int_out: Timer bottom -> IRC bottom -->
  <path class="wire" d="M 175,350 V 400 H 330 V 350"/>
  <text class="sig" x="252" y="390">timer_int_out</text>

  <!-- ===== Serial pins ===== -->
  <!-- serial_int_out: Serial bottom -> IRC bottom -->
  <path class="wire" d="M 890,350 V 400 H 730 V 350"/>
  <text class="sig" x="810" y="390">serial_int_out</text>

  <line class="wire" x1="950" y1="450" x2="950" y2="350"/>
  <text class="sig" x="950" y="472">serial_in</text>

  <line class="wire" x1="1045" y1="350" x2="1045" y2="450"/>
  <text class="sig" x="1045" y="472">serial_out</text>

  <!-- ===== IRC inputs (reserved / optional) ===== -->
  <line class="wire dash" x1="500" y1="450" x2="500" y2="350"/>
  <text class="sig" x="500" y="472">ipi_int_in</text>
  <text class="note" x="500" y="490">(reserved)</text>

  <line class="wire dash" x1="620" y1="450" x2="620" y2="350"/>
  <text class="sig" x="620" y="472">env_int_in</text>
  <text class="note" x="620" y="490">(external, optional)</text>

  <!-- ===== interrupt_level (4-bit): IRC top -> Core bottom, crossing the bus (no connection) ===== -->
  <line x1="630" y1="181" x2="630" y2="199" stroke="#ffffff" stroke-width="12"/>
  <line class="wire" x1="630" y1="270" x2="630" y2="110"/>
  <line x1="621" y1="244" x2="639" y2="226" stroke="#000000" stroke-width="2"/>
  <text x="645" y="241" font-size="14">4</text>
  <text x="642" y="150" font-size="16">interrupt_level</text>

  <text x="555" y="545" text-anchor="middle" font-size="20" fill="#555555">Programmer's view of the devices.</text>
</svg>
